{% extends "user/base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto p-6 bg-gray-900 rounded-xl">
  <h1 class="text-2xl font-bold mb-4">Live Football Scores</h1>
  <div id="scores" class="space-y-3"></div>
</div>

<script>
fetch("/api/football/scores")
  .then(r => r.json())
  .then(data => {
    document.getElementById("scores").innerHTML =
      data.matches.map(m => `
        <div class="bg-gray-800 p-3 rounded">
          ${m.home} ${m.score} ${m.away}
        </div>
      `).join("")
  })
</script>
{% endblock %}
