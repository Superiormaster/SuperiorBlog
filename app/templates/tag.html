{% extends "base.html" %}

{% block title %}{{ tag.name }} News | ProfNet News{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6 text-center mt-10 text-gray-700">#{{ tag.name }}</h1>

{% for post in posts %}
  <a href="{{ url_for('public.post_detail', slug=post.slug) }}"
     class="block mb-4 text-center text-xl hover:underline">
     {{ post.title }}

      {% if post.featured_image %}
        <img src="{{ post.featured_image }}"
        class="rounded w-full object-cover mt-2 h-40">
      {% endif %}
  </a>
{% else %}
  <p>No posts found.</p>
{% endfor %}
{% endblock %}
