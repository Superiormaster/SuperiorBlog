<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject or "Superior News" }}</title>
</head>

<body style="margin:0;padding:0;font-family:Arial,sans-serif;background:#1F2937;">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="padding:20px;">

<table width="600" cellpadding="0" cellspacing="0" border="0"
style="background:#1F2937;border-radius:8px;padding:20px;">

    <!-- Logo -->
    <tr>
        <td align="center" style="padding-bottom:20px;">
            <img
                src="https://www.superiornews.app/static/Img/New.png"
                width="120"
                alt="Superior News"
                style="display:block;border:0;margin:0 auto;">
        </td>
    </tr>

    <!-- Heading -->
    <tr>
        <td>
            <h2 style="
                color:#ffffff;
                text-align:center;
                margin-top:0;
                margin-bottom:10px;">
                {{ subject or "Superior News" }}
            </h2>
        </td>
    </tr>

    <!-- Draft Body -->
    <tr>
        <td style="
            color:#CCCCCC;
            font-size:15px;
            line-height:1.7;
        ">

            {% if draft_html %}
                {{ draft_html|safe }}
            {% endif %}

        </td>
    </tr>

    <!-- CTA -->
    <tr>
        <td align="center" style="padding-top:30px;">

            <a
                href="https://www.superiornews.app"
                style="
                    background:#1a73e8;
                    color:#ffffff;
                    padding:12px 24px;
                    border-radius:6px;
                    text-decoration:none;
                    display:inline-block;
                    font-weight:bold;
                ">
                Visit Superior News
            </a>

        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td
            align="center"
            style="
                padding-top:30px;
                font-size:12px;
                color:#888888;
            ">

            <p>
                You are receiving this email because you subscribed to
                <strong>Superior News</strong>.
            </p>

            <p>

                <a
                    href="{{ url_for('public.unsubscribe', token=subscriber.unsubscribe_token, _external=True) }}"
                    style="color:#FACC15;text-decoration:none;">
                    Unsubscribe
                </a>

            </p>

            <p>
                © {{ now.year }} Superior News
            </p>

            <p>
                Superior News Team
            </p>

        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
