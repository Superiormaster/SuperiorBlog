<!-- templates/emails/welcome_email.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Superior News</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#1F2937;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:20px;">

        <!-- Main container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#1F2937; padding:20px; border-radius:8px;">
          
          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <img src="https://www.superiornews.app/static/Img/New.png" 
                   alt="Superior News" 
                   width="120" 
                   style="display:block; border:0; margin:0 auto;">
            </td>
          </tr>

          <!-- Welcome Heading -->
          <tr>
            <td>
              <h2 style="color:#fff; text-align:center;">Welcome to Superior News!</h2>
              <p style="color:#666; text-align:center;">Your ideas deserve an audience.</p>
            </td>
          </tr>

          <!-- Call to Action -->
          <tr>
            <td style="padding-top:10px; text-align:center;">
              <a href="https://www.superiornews.app/login"
                 style="background-color:#1a73e8; color:#ffffff; padding:10px 20px; text-decoration:none; border-radius:5px; display:inline-block;">
                Login & Start Creating
              </a>
            </td>
          </tr>

          <!-- Footer / Unsubscribe -->
          <tr>            
            <td class="footer" style="font-size: 12px;
            color: #888;
            margin-top: 20px;
            text-align: center;">
              <p>You are receiving this email because you subscribed to Superior News.</p>
              <p>
                <a href="{{ url_for('public.unsubscribe', token=subscriber.unsubscribe_token, _external=True) }}">Unsubscribe</a>
              </p>
              <p>© {{ now.year }} Superior News</p>
               <p>Superior News Team</p>
            </td>

          </tr>

        </table>
        <!-- End main container -->

      </td>
    </tr>
  </table>
  <!-- End outer wrapper -->

</body>
</html>
