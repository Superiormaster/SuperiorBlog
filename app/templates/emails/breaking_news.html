{% extends "emails/base.html" %}

{% block title %}
Breaking News
{% endblock %}

{% block heading %}
🚨 Latest Breaking News
{% endblock %}

{% block content %}

<ul style="margin:0;padding:0;list-style:none;">

    {% for post in news_items %}

    <li style="margin-bottom:24px;">

        {% if post.featured_image %}
        <img
            src="{{ post.featured_image }}"
            alt="{{ post.title }}"
            style="
                display:block;
                width:100%;
                max-width:560px;
                height:auto;
                border-radius:6px;
                margin-bottom:10px;
            ">
        {% endif %}

        <a
            href="https://www.superiornews.app/post/{{ post.slug }}"
            style="
                color:#FACC15;
                font-size:16px;
                font-weight:bold;
                text-decoration:none;
                line-height:1.4;
                display:block;
                margin-bottom:8px;
            ">
            {{ post.title }}
        </a>

    </li>

    {% endfor %}

</ul>

{% endblock %}
