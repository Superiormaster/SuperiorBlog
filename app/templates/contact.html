{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto py-10 px-4">
  <h2 class="mb-6 text-center text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">Contact Us</h2>

  <form method="POST" class="space-y-4 bg-gray-800 p-6 border border-rose-100 rounded-lg shadow-lg">
    
    <div>
      <label for="name" class="block mb-1 font-medium text-gray-300">Name:</label>
      <input 
        type="text" 
        id="name"
        name="name" 
        class="w-full rounded-lg focus:outline-none py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:bg-blue-500/5 focus:border-blue-500"
      >
    </div>

    <div>
      <label for="email" class="block mb-1 font-medium text-gray-300">Email:</label>
      <input 
        type="email" 
        id="email"
        name="email" 
        required
        class="w-full rounded-lg focus:outline-none py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:bg-blue-500/5 focus:border-blue-500"
      >
    </div>

    <div>
      <label for="message" class="block mb-1 font-medium text-gray-300">Message:</label>
      <textarea 
        id="message"
        name="message" 
        rows="5" 
        required
        class="w-full rounded-lg focus:outline-none py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:bg-blue-500/5 focus:border-blue-500"
      ></textarea>
    </div>

    <button type="submit" class="w-full text-black font-semibold rounded-lg transition-colors duration-200 py-3 bg-blue-300 shadow-lg hover:bg-blue-700 transition relative overflow-hidden hover:-translate-y-0.5 hover:shadow-[0_0_15px_rgba(50,130,246,0.4)]">
      Send Message
    </button>

    <p class="mt-3 text-center text-gray-400">Or</p>

    <a href="mailto:profnet100@gmail.com" class="w-full block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors duration-200">
      Email directly
    </a>

  </form>
</div>
{% endblock %}
