{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto px-4 mt-9 py-12">
  <h2 class="text-2xl font-bold mb-6 text-gray-400">Create Email Draft</h2>

  <form method="post" class="space-y-6 bg-white/5 shadow-md rounded-lg p-6">
    
    <!-- Subject Input -->
    <div>
      <label for="subject" class="block text-sm font-medium text-gray-400 mb-1">Email Subject</label>
      <input 
        id="subject"
        name="subject" 
        type="text" 
        placeholder="Enter email subject" 
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition placeholder:text-gray-600 text-gray-100"
        required
      >
    </div>

    <!-- HTML Content Textarea -->
    <div>
      <label for="html_content" class="block text-sm font-medium text-gray-400 mb-1">Email Content</label>
      <textarea 
        id="html_content"
        name="html_content" 
        rows="12" 
        placeholder="Write email here" 
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-600 focus:border-blue-500 transition text-gray-100"
        required
      ></textarea>
    </div>

    <!-- Save Draft Button -->
    <div class="flex justify-end">
      <button 
        type="submit"
        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition"
      >
        Save Draft
      </button>
    </div>

  </form>
</div>

{% endblock %}
