{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto px-4 mt-4 py-10">
  <h2 class="text-2xl font-bold mb-6 text-gray-400">Create Email Draft</h2>

  <form method="post" enctype="multipart/form-data" class="space-y-6 bg-white/5 shadow-md rounded-lg p-6">
    
    <div>
      <label class="block text-sm font-medium text-gray-400 mb-1">
          Platform
      </label>
  
      <select
          name="platform"
          id="platform"
          class="w-full rounded-lg border px-4 py-2 dark:bg-gray-800 text-black dark:text-white">
  
          <option value="superior_news"
              {{ "selected" if selected_platform == "superior_news" else "" }}>
              Superior News Newsletter
          </option>
          
          <option value="tribe"
              {{ "selected" if selected_platform == "tribe" else "" }}>
              Tribe Newsletter
          </option>
          
          {% if subscriber %}
          <option value="single_email"
              {{ "selected" if selected_platform == "single_email" else "" }}>
              Selected Subscriber ({{ subscriber.email }})
          </option>
          {% endif %}
  
      </select>
    </div>
  
    <div>
      <label class="block text-sm font-medium text-gray-400 mb-1">
          Recipient
      </label>
  
      <input
          type="email"
          name="recipient"
          value="{{ subscriber.email if subscriber else '' }}"
          readonly
          class="w-full rounded-lg border px-4 py-2 bg-gray-100 dark:bg-gray-700">
    </div>
    
    <!-- Subject Input -->
    <div>
      <label for="subject" class="block text-sm font-medium text-gray-400 mb-1">Email Subject</label>
      <input 
        id="subject"
        name="subject" 
        type="text" 
        placeholder="Enter email subject" 
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition dark:bg-gray-800 placeholder:text-gray-600 text-black dark:text-gray-100"
        required
      >
    </div>

    <!-- HTML Content Textarea -->
    <div>
      <label for="html_content" class="block text-sm font-medium text-gray-400 mb-1">Email Content</label>
      <textarea 
        id="html_content"
        name="html_content" 
        rows="12" 
        placeholder="Write email here" 
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 placeholder:text-gray-600 focus:border-blue-500 transition text-black dark:text-gray-100"
        required
      ></textarea>
    </div>

    
                <!-- Image URL -->
                <div class="space-y-1">
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Image URL (optional)
                    </label>
                    <input type="text" name="image_url"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="">
                    <input type="file" name="image" id="imageUpload"
                    class="w-full rounded-xl border px-4 py-2">
                </div>
                <input type="hidden" name="ad_width" id="adWidth">
                <div id="image-preview">
                  <img id="previewImage"
                  class="w-full max-h-[400px] object-contain rounded-lg border hidden">
                  <p id="dimensions" class="text-sm text-gray-600 mt-1"></p>
                </div>

    <!-- Save Draft Button -->
    <div class="flex justify-end">
      <button 
        type="submit"
        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition"
      >
        Save Draft
      </button>
    </div>

  </form>
</div>


<script>
document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("imageUpload");
    const previewImage = document.getElementById("previewImage");
    const adWidthInput = document.getElementById("adWidth");
    const dimensions = document.getElementById("dimensions");

    if (!previewImage || !input) return;

    const targetHeight = 200;

    input.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
    
        previewImage.src = URL.createObjectURL(file);
        previewImage.classList.remove("hidden");
    
        const img = new Image();
    
        img.onload = () => {
            dimensions.textContent =
                `Original size: ${img.width} × ${img.height}px`;
        };
    
        img.src = previewImage.src;
    });
});

</script>

{% endblock %}
