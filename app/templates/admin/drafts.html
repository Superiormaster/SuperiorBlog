{% extends "base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto p-4 mt-10 space-y-6">
  <h2 class="text-2xl font-bold text-gray-500">All Drafts</h2>
  {% if drafts %}
    {% for draft in drafts %}
      <div class="border p-4 rounded shadow-sm bg-white/5">
        <h3 class="font-semibold text-black dark:text-white text-lg">{{ draft.subject }}</h3>
        <a href="{{ url_for('admin.preview_draft', id=draft.id) }}"
           class="text-blue-600 hover:underline">Preview</a>
        <form method="post" action="{{ url_for('admin.create_draft_campaign_route', id=draft.id) }}" class="mt-2">
            <button type="submit"
                    class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                Send Draft
            </button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <p>No drafts available.</p>
  {% endif %}
</div>

{% endblock %}
