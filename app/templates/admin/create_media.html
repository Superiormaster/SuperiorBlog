{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 dark:bg-gray-900 py-10 px-4">
    <div class="max-w-3xl mx-auto">

        <!-- Card -->
        <div class="bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-8">

            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">
                {{ 'Edit' if ad else 'Create' }} Ad / Media Block
            </h2>

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Internal Name -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Internal Name
                    </label>
                    <input type="text" name="name" required
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="{{ ad.name if ad else '' }}">
                </div>
                <!-- Location -->
<div>
    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
        Location
    </label>

    <select name="location"
        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
               bg-white dark:bg-gray-700
               text-gray-900 dark:text-white
               px-4 py-2 focus:ring-2 focus:ring-blue-500
               focus:outline-none transition">

        <option value="home_top" {% if ad and ad.location=='home_top' %}selected{% endif %}>
            Homepage Top
        </option>

        <option value="home_mid" {% if ad and ad.location=='home_mid' %}selected{% endif %}>
            Homepage Middle
        </option>

        <option value="post_top" {% if ad and ad.location=='post_top' %}selected{% endif %}>
            Post Top
        </option>

        <option value="post_mid" {% if ad and ad.location=='post_mid' %}selected{% endif %}>
            Post Middle (In-Article)
        </option>

        <option value="post_bottom" {% if ad and ad.location=='post_bottom' %}selected{% endif %}>
            Post Bottom
        </option>

        <option value="sidebar" {% if ad and ad.location=='sidebar' %}selected{% endif %}>
            Sidebar
        </option>

        <option value="sticky_bottom" {% if ad and ad.location=='sticky_bottom' %}selected{% endif %}>
            Sticky Bottom
        </option>

    </select>
</div>

                <!-- Type -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Media Type
                    </label>
                    <select name="type"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition">

                        <option value="custom" {% if ad and ad.type=='custom' %}selected{% endif %}>Custom Banner</option>
                        <option value="adsense" {% if ad and ad.type=='adsense' %}selected{% endif %}>AdSense</option>

                    </select>
                </div>

                <!-- Title -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Title / CTA
                    </label>
                    <input type="text" name="title"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="{{ ad.title if ad else '' }}">
                </div>

                <!-- Image URL -->
                <div class="space-y-1">
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Image URL (optional)
                    </label>
                    <input type="text" name="image_url"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="{{ ad.image_url if ad else '' }}">
                    <input type="file" name="image"
                    class="w-full rounded-xl border px-4 py-2">
                </div>
                <div id="image-preview">
                {% if ad and ad.image_url %}
                <divclass="mt-3">
                    <p class="text-sm text-gray-500 mb-2">Current Image:</p>
                    <img src="{{ ad.image_url }}"
                         class="w-full max-h-64 object-cover rounded-lg border">
                </div>
                {% endif %}
                </div>

                <!-- Target URL -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Target URL (if external)
                    </label>
                    <input type="text" name="target_url"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="{{ ad.target_url if ad else '' }}">
                </div>

                <!-- HTML / AdSense Code -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        HTML / AdSense Code
                    </label>
                    <textarea name="html_code" rows="5"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition resize-none">{{ ad.html_code if ad else '' }}</textarea>
                </div>

                <!-- Priority -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                        Priority
                    </label>
                    <input type="number" name="priority"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600
                               bg-white dark:bg-gray-700
                               text-gray-900 dark:text-white
                               px-4 py-2 focus:ring-2 focus:ring-blue-500
                               focus:outline-none transition"
                        value="{{ ad.priority if ad else 1 }}">
                </div>

                <!-- Internal & Active Checkboxes -->
                <div class="flex items-center gap-4">
                    <label>
                        <input type="checkbox" name="internal" {% if ad and ad.internal %}checked{% endif %}>
                        Internal Ad (Caption Generator)
                    </label>
                    <label>
                        <input type="checkbox" name="active" {% if not ad or ad.active %}checked{% endif %}>
                        Active
                    </label>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700
                               text-white font-semibold
                               py-3 rounded-xl shadow-md
                               transition duration-200">
                        {{ 'Update' if ad else 'Create' }}
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const imageInput = document.querySelector('input[name="image"]');
    const previewDiv = document.getElementById("image-preview");

    imageInput.addEventListener("change", function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewDiv.innerHTML = `<img src="${e.target.result}" class="w-full max-h-64 object-cover rounded-lg border">`;
            }
            reader.readAsDataURL(file);
        }
    });
});
</script>

{% endblock %}
