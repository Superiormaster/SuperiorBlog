{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 py-10 shadow rounded">
  <h2 class="mb-6 text-center text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">Change Password</h2>

  <form method="POST" class="border border-rose-100 p-6">
    <label class="block mb-2 font-medium">Current Password</label>
    <input type="password" id="current_password" name="current_password" class="w-full mb-4 py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:outline-none focus:bg-blue-500/5 focus:border-blue-500" required>

    <label class="block mb-2 font-medium">New Password</label>
    <input type="password" id="new_password" name="new_password" class="w-full py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:outline-none focus:bg-blue-500/5 focus:border-blue-500 mb-4" required>

    <label class="block mb-2 font-medium">Confirm New Password</label>
    <input type="password" id="confirm_password" name="confirm_password" class="w-full py-3 px-4 border-white/10 bg-white/10 border rounded text-white transition focus:outline-none focus:bg-blue-500/5 focus:border-blue-500 mb-4" required>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="show_password" onclick="show_pass()">
            <label class="form-check-label" for="show_password">Show Password</label>
        </div>

    <button type="submit" class="w-full text-white px-8 py-3 bg-blue-600 rounded-xl shadow-lg hover:bg-blue-700 transition relative font-medium overflow-hidden hover:-translate-y-0.5 hover:shadow-[0_0_15px_rgba(50,130,246,0.4)]">Change Password</button>
  </form>
</div>

<script>
function show_pass() {
  const passwords = document.querySelectorAll('input[type="password"], input[type="text"]');

  passwords.forEach(input => {
    if (input.type === "password") {
      input.type = "text";
    } else if (input.type === "text" && (input.id === "current_password" || input.id === "new_password" || input.id === "confirm_password")) {
      input.type = "password";
    }
  });
}
</script>

{% endblock %}
