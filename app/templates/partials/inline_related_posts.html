<div class="not-prose my-6">
    <div class="bg-gray-100 dark:bg-gray-800 rounded-2xl border border-gray-700 p-5">

        <h3 class="text-center uppercase tracking-[0.2em] text-gray-400 text-sm font-semibold mb-5">
            {{ section_title }}
        </h3>

        <ul class="space-y-4">
            {% for post in related_posts[:3] %}
            <li class="flex items-start gap-3">

                <span class="text-red-600 text-xl leading-none mt-1">•</span>

                <a href="{{ url_for('public.post_detail', slug=post.slug) }}"
                   class="flex-1 text-lg text-gray-900 dark:text-white hover:text-blue-500">
                    {{ post.title }}
                </a>

            </li>
            {% endfor %}
        </ul>

    </div>
</div>
