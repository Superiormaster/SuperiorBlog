<div class="my-8 rounded-xl border border-gray-300 dark:border-gray-700 p-5 bg-gray-100 dark:bg-gray-800">

    <h3 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">
        {{ section_title }}
    </h3>

    <div class="space-y-4">

        {% for post in related_posts[:3] %}

        <a href="{{ url_for('public.post_detail', slug=post.slug) }}"
           class="flex gap-3 group">

            {% if post.featured_image %}
            <img src="{{ post.featured_image }}"
                 class="w-24 h-20 rounded object-cover">
            {% endif %}

            <div>

                <p class="font-semibold group-hover:text-blue-600 dark:group-hover:text-yellow-500 line-clamp-2">
                    {{ post.title }}
                </p>

                <span class="text-sm text-gray-500">
                    {{ post.views }} views
                </span>

            </div>

        </a>

        {% endfor %}

    </div>

</div>
